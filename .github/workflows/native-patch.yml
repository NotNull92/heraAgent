name: Native patch qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-smoke:
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Build Hera client and qualify experimental runtime
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Client build failed' }
          node scripts/qualify-native-patch.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native qualification failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-patch-receipt-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: .artifacts/native-patch-receipt.json
