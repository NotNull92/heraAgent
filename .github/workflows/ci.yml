name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify architecture and run offline checks
        shell: pwsh
        run: |
          node -e "console.log(process.platform,process.arch,process.version); if(process.arch !== '${{ matrix.arch }}')process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'Wrong runner architecture' }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Typecheck failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          node scripts/credentials-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native credential store smoke failed' }
          npm run native:smoke
          if ($LASTEXITCODE -ne 0) { throw 'Native initialization failed' }
          node node_modules/playwright/cli.js install chromium --no-remove
          if ($LASTEXITCODE -ne 0) { throw 'Research browser install failed' }
          node scripts/research-browser-check.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Research browser fixtures failed' }
      - name: Build the single Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run release:prepare
          if ($LASTEXITCODE -ne 0) { throw 'Package preparation failed' }
          npm run package:check
          if ($LASTEXITCODE -ne 0) { throw 'Package inspection failed' }
          npm run package:smoke
          if ($LASTEXITCODE -ne 0) { throw 'Windows package smoke failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Windows'
        with:
          name: hera-windows-built-package
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/*.tgz
            .artifacts/SHA256SUMS.txt
            .artifacts/release-notes.md
            .artifacts/compatibility.json
            scripts/smoke-package.mjs
            scripts/package-utils.mjs
  installed-package:
    timeout-minutes: 15
    needs: offline
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hera-windows-built-package
      - name: Install identical archive without a source checkout
        shell: pwsh
        run: |
          node -e "console.log(process.platform,process.arch,process.version); if(process.arch !== '${{ matrix.arch }}')process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'Wrong runner architecture' }
          node scripts/smoke-package.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Exact-artifact package smoke failed' }
